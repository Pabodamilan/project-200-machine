<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NODA Civimech Engineering - Digital fleet, machine & site management system for construction operations in Sri Lanka.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NODA Civimech Engineering">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NODA Civimech Engineering (PVT) Ltd.</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API — used by google_maps_flutter on web
       (GPS Live Tracking / LiveTrackingScreen). Pinned to the quarterly
       channel (v=quarterly) — no version param defaults to the weekly
       channel, which ships breaking changes far more often and is not
       what a production app should run against. Same API key as before.

       KNOWN LOCAL-DEV FAILURE (confirmed, not caused by v=quarterly —
       reproduced identically with and without it against Google's live
       servers): this API key has an HTTP referrer restriction in Google
       Cloud Console that only allows the published app's domain. Running
       locally (`flutter run -d chrome`, served from http://localhost:PORT)
       is NOT on that allow-list, so Google's own JS rejects it with
       RefererNotAllowedMapError and paints "Oops! Something went wrong.
       This page didn't load Google Maps correctly." directly into the map
       — entirely inside Google's script, never as a Dart exception, so
       nothing in main.dart can catch or log it except the gm_authFailure
       hook (see maps_auth_failure_web.dart / main()'s
       _installGoogleMapsAuthFailureLogging). To fix local dev: add your
       local origin(s) to this key's allowed HTTP referrers in Google Cloud
       Console, or use a separate unrestricted key for local builds. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDQZui_o-2yA7KxLjYHUK9ORa97jWEcXoU&v=quarterly"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
